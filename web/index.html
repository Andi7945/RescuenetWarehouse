<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="rescuenet_warehouse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>rescuenet_warehouse</title>
  <link rel="manifest" href="manifest.json">

  <!-- Mock Firebase for Playwright testing only - MUST load before Flutter -->
  <script>
    // Load mock Firebase when running Playwright tests or when mock=true parameter is present
    const isPlaywrightTest = navigator.userAgent.includes('Playwright') || 
                             navigator.userAgent.includes('HeadlessChrome') ||
                             window.location.search.includes('mock=true');
    
    console.log('Mock Firebase detection:', {
      userAgent: navigator.userAgent,
      location: window.location.href,
      hostname: window.location.hostname,
      search: window.location.search,
      isPlaywrightTest: isPlaywrightTest
    });
    
    if (isPlaywrightTest) {
      console.log('Loading mock Firebase for test mode');
      // Set a flag to prevent real Firebase initialization
      window.MOCK_FIREBASE_MODE = true;
    } else {
      console.log('Loading real Firebase for production mode');
      window.MOCK_FIREBASE_MODE = false;
    }
  </script>
  
  <!-- Load mock Firebase synchronously before Flutter if in test mode -->
  <script src="mock-firebase.js"></script>

  <!-- Flutter renderer configuration -->
  <script>
    // Store Flutter configuration for use with engineInitializer
    window.flutterConfig = {};
    
    // Force HTML rendering for Playwright tests to enable DOM selectors
    if (isPlaywrightTest) {
      window.flutterConfig = {
        renderer: "html"  // Use HTML renderer instead of canvas for testing
      };
      console.log('Using HTML renderer for testing');
    }
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- Override Flutter loader to use our config -->
  <script>
    // Create a custom Flutter loader that applies our configuration
    window.addEventListener('DOMContentLoaded', function() {
      // Store the original load function
      const originalLoad = window._flutter?.loader?.load;
      
      // Override the loader when it becomes available
      const overrideLoader = () => {
        if (window._flutter && window._flutter.loader && !window._flutter.loader._configOverridden) {
          const loader = window._flutter.loader;
          const originalLoad = loader.load.bind(loader);
          
          loader.load = function(options = {}) {
            // Merge our config with any existing config
            const mergedOptions = {
              ...options,
              config: {
                ...options.config,
                ...window.flutterConfig
              }
            };
            return originalLoad(mergedOptions);
          };
          
          loader._configOverridden = true;
        } else if (!window._flutter?.loader?._configOverridden) {
          setTimeout(overrideLoader, 10);
        }
      };
      
      overrideLoader();
    });
  </script>
  
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
</body>
</html>
