<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mock Firebase Debug Test</title>
</head>
<body>
    <div id="output"></div>
    
    <script>
        // Set mock mode
        window.MOCK_FIREBASE_MODE = true;
    </script>
    
    <!-- Load mock Firebase -->
    <script src="../../web/mock-firebase.js"></script>
    
    <script>
        async function debugMockFirebase() {
            const output = document.getElementById('output');
            
            function log(message) {
                console.log(message);
                output.innerHTML += message + '<br>';
            }
            
            log('Starting Mock Firebase Debug Test');
            log('=================================');
            
            // Check if mock mode is enabled
            log('Mock mode enabled: ' + window.MOCK_FIREBASE_MODE);
            log('Mock Firebase exists: ' + !!window.mockFirebase);
            
            if (!window.mockFirebase) {
                log('ERROR: Mock Firebase not available!');
                return;
            }
            
            // Test authentication
            const auth = window.mockFirebase.auth();
            log('Auth object created: ' + !!auth);
            log('Initial current user: ' + auth.currentUser);
            
            // Test sign in with valid credentials
            try {
                log('Attempting sign in with backoffice.test@rescuenet.net...');
                const result = await auth.signInWithEmailAndPassword('backoffice.test@rescuenet.net', 'testpassword');
                log('Sign in successful!');
                log('User: ' + JSON.stringify(result.user, null, 2));
                log('Current user after sign in: ' + JSON.stringify(auth.currentUser, null, 2));
            } catch (error) {
                log('Sign in failed: ' + error.message);
                log('Error details: ' + JSON.stringify(error, null, 2));
            }
            
            // Test sign in with invalid credentials
            try {
                log('Testing invalid credentials...');
                await auth.signInWithEmailAndPassword('wrong@email.com', 'wrongpass');
                log('ERROR: Invalid credentials should have failed!');
            } catch (error) {
                log('Invalid credentials correctly rejected: ' + error.message);
            }
            
            log('=================================');
            log('Mock Firebase Debug Test Complete');
        }
        
        // Run the test when page loads
        window.addEventListener('load', debugMockFirebase);
    </script>
</body>
</html>
