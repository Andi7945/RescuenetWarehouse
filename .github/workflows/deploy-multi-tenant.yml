name: Deploy Multi-Tenant

on:
  push:
    branches:
      - develop    # Auto-deploy to staging
      - main       # Auto-deploy to production
  workflow_dispatch:
    inputs:
      org:
        description: 'Organization to deploy'
        required: true
        type: choice
        options:
          - rescuenet
          - all
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        org: [rescuenet]  # Add more orgs here as needed

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "org=${{ github.event.inputs.org }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "org=${{ matrix.org }}" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "org=${{ matrix.org }}" >> $GITHUB_OUTPUT
          fi

      - name: Build ${{ matrix.org }}
        run: |
          ORG="${{ steps.env.outputs.org }}"
          ENV="${{ steps.env.outputs.env }}"

          # Validate inputs
          if [ -z "$ORG" ] || [ "$ORG" = "all" ]; then
            ORG="${{ matrix.org }}"
          fi

          echo "Building $ORG for $ENV environment..."

          # Build with dart-define flags
          flutter build web \
            --dart-define=ORG="$ORG" \
            --dart-define=ENV="$ENV" \
            --release \
            --web-renderer canvaskit

          # Move to environment-specific directory
          BUILD_DIR="build/web_${ORG}_${ENV}"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cp -r build/web/* "$BUILD_DIR/"

          echo "Build complete: $BUILD_DIR"

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy ${{ matrix.org }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          ORG="${{ steps.env.outputs.org }}"
          ENV="${{ steps.env.outputs.env }}"

          # Validate inputs
          if [ -z "$ORG" ] || [ "$ORG" = "all" ]; then
            ORG="${{ matrix.org }}"
          fi

          BUILD_DIR="build/web_${ORG}_${ENV}"

          # Verify build exists
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build not found at $BUILD_DIR"
            exit 1
          fi

          # Copy build to firebase public directory
          rm -rf build/web
          cp -r "$BUILD_DIR" build/web

          # Switch to correct Firebase project
          RC_FILE=".firebaserc_${ORG}_${ENV}"
          if [ ! -f "$RC_FILE" ]; then
            echo "Error: Firebase RC file not found: $RC_FILE"
            exit 1
          fi

          cp "$RC_FILE" .firebaserc

          echo "Deploying $ORG to $ENV..."
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive

      - name: Deployment summary
        run: |
          ORG="${{ steps.env.outputs.org }}"
          ENV="${{ steps.env.outputs.env }}"

          # Validate inputs
          if [ -z "$ORG" ] || [ "$ORG" = "all" ]; then
            ORG="${{ matrix.org }}"
          fi

          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Org:** $ORG" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** $ENV" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
